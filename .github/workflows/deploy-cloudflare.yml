name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: cloudflare-workers-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare-workers-production
      url: https://helpmebe.me
    env:
      DEPLOY_TARGET: cloudflare
      PUBLIC_SITE_URL: https://helpmebe.me/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check dependency lockfile
        id: lockfile
        run: test -f package-lock.json && echo "missing=false" >> "$GITHUB_OUTPUT" || echo "missing=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          if test -f package-lock.json; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Persist generated lockfile
        if: steps.lockfile.outputs.missing == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "chore: regenerate package lock"
          git push origin HEAD:main

      - name: Check Astro project
        run: npm run check

      - name: Build Worker
        run: npm run build

      - name: Deploy to Cloudflare Workers
        id: cloudflare-deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
